name: Build Rent Electricity APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir source
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

      - name: Build APK
        run: gradle -p source/RentElectricityTracker assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Electricity-Tracker-APK
          path: source/RentElectricityTracker/app/build/outputs/apk/debug/app-debug.apk
